name: Load & Performance Testing Gate (k6 & Locust)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 2 * * *' # Nightly at 2 AM
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Base URL'
        required: true
        default: 'http://127.0.0.1:8000'
      scenarios_count:
        description: 'Number of unique scenarios to execute'
        required: true
        default: '50'

jobs:
  performance-gate:
    name: 🚀 Load & Performance SLA Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt openpyxl pandas

      - name: Start Mock Target Server
        run: |
          python -m uvicorn mock_server.server:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Execute Full Async Python 300+ Scenarios Runner
        run: |
          mkdir -p reports
          python tests/load/load_test_runner.py --url http://127.0.0.1:8000 --limit ${{ github.event.inputs.scenarios_count || 50 }} --output-html reports/load_test_report.html --output-json reports/load_test_results.json

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-performance-reports-and-metrics
          path: |
            reports/load*
            reports/*.xlsx
          retention-days: 30
